name: build
on:
  push:
    branches-ignore:
      - ci-results
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    name: Compile project
    runs-on: windows-2022
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          # SDK 10.0.26100 breaks kauai/src/appbwin.cpp (_mm_prefetch C2733)
          sdk: 10.0.22621.0

      - name: Compile
        id: compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' | Select-Object -ExpandProperty Name | Set-Content ci-out/sdks.txt
          cmake --preset x86:msvc:relwithdebinfo 2>&1 | Tee-Object -FilePath ci-out/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build 2>&1 | Tee-Object -FilePath ci-out/build.log
          exit $LASTEXITCODE

      - name: Render test movies
        if: steps.compile.outcome == 'success' && hashFiles('tools/render/render-ci.ps1') != '' && hashFiles('test-movies/**/*.3mm') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/render/render-ci.ps1 -BuildDir build -MovieDir test-movies -OutDir ci-out/render

      - name: Package the renderer
        id: package
        if: steps.compile.outcome == 'success'
        shell: pwsh
        run: |
          $pkg = "package/3dmm-render"
          New-Item -ItemType Directory -Force "$pkg/3D Movie Maker" | Out-Null
          Copy-Item (Get-ChildItem -Recurse build -Filter 3dmm-render.exe | Select-Object -First 1).FullName $pkg
          Copy-Item (Get-ChildItem -Recurse build -Filter 3dmm-crt.exe | Select-Object -First 1).FullName $pkg
          Copy-Item tools/render/render-folder.ps1, tools/render/encode-movie.ps1, tools/render/mix-audio.ps1, tools/render/get-tools.ps1, tools/render/README.md $pkg
          Copy-Item content-files/*.3cn, content-files/*.3th "$pkg/3D Movie Maker"
          Copy-Item (Get-ChildItem -Recurse build/chomp/studio -Filter utest.chk | Select-Object -First 1).FullName "$pkg/3D Movie Maker/3DMovie.chk"
          # the app, built with the C# compiler that ships with Windows
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe"
          # (this csc reads "/" in paths as option markers: use backslashes)
          & $csc /nologo /langversion:5 /target:winexe /optimize "/out:package\3dmm-render\Movie Exporter.exe" `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll tools\render\app\MovieExporter.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: End-to-end batch test (Windows PowerShell 5.1)
        id: batch
        if: steps.package.outcome == 'success' && hashFiles('test-movies/**/*.3mm') != ''
        shell: pwsh
        run: |
          if (Test-Path build/tools) { Copy-Item -Recurse build/tools package/3dmm-render/tools }
          powershell -NoProfile -ExecutionPolicy Bypass -File package/3dmm-render/render-folder.ps1 `
            -InputDir test-movies -OutputDir ci-out/batch -Formats anaglyph,2d -Scale 1 *>&1 |
            Tee-Object -FilePath ci-out/batch.log
          Get-ChildItem -Recurse ci-out/batch -Filter *.mp4 | Select-Object Name, Length | Out-File ci-out/batch-files.txt
          Get-ChildItem -Recurse ci-out/batch -Filter *.mp4 | Remove-Item
          Remove-Item -Recurse -Force package/3dmm-render/tools -ErrorAction SilentlyContinue

      - name: App test
        if: steps.package.outcome == 'success' && hashFiles('test-movies/**/*.3mm') != ''
        shell: pwsh
        run: |
          # the way a person would use it: no tools yet (it fetches what's
          # missing), one movie, MP4 + AVI, improved style
          Remove-Item -Recurse -Force package/3dmm-render/tools -ErrorAction SilentlyContinue
          $app = "ci-out/app"
          New-Item -ItemType Directory -Force $app | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath "package/3dmm-render/Movie Exporter.exe" -PassThru -Wait -ArgumentList @(
            "`"$pwd/test-movies/City Tour.3mm`"", "--out", "`"$pwd/$app/videos`"", "--make", "mp4,avi",
            "--go", "--close-when-done", "--screenshot", "`"$pwd/$app/app.png`"")
          "exit $($p.ExitCode) in $([Math]::Round($sw.Elapsed.TotalSeconds)) s" | Tee-Object "$app/app.txt"
          Get-ChildItem -Recurse "$app/videos" | Select-Object Name, Length | Out-File -Append "$app/app.txt"
          Get-Content "$app/videos/report.csv" -ErrorAction SilentlyContinue | Out-File -Append "$app/app.txt"
          Get-ChildItem -Recurse "$app/videos" -Include *.mp4, *.avi | Remove-Item
          Remove-Item -Recurse -Force package/3dmm-render/tools -ErrorAction SilentlyContinue

      - name: Full-quality renders on request
        if: steps.package.outcome == 'success' && hashFiles('ci-render-requests.txt') != ''
        shell: pwsh
        run: |
          # one test-movies file name per line, or render-folder.ps1 options
          # such as -Smooth or -Formats 2d,avi (apply to all); outputs land in ci-results
          $req = Join-Path $env:RUNNER_TEMP "requested"
          New-Item -ItemType Directory -Force $req | Out-Null
          $lines = @(Get-Content ci-render-requests.txt | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          $switches = @()
          foreach ($l in $lines) {
            if ($l.StartsWith('-')) { $switches += -split $l }
            else { Copy-Item -LiteralPath (Join-Path test-movies $l) $req }
          }
          if (-not (Get-ChildItem $req -Filter *.3mm)) { Write-Host "no movies requested"; exit 0 }
          if (Test-Path build/tools) { Copy-Item -Recurse build/tools package/3dmm-render/tools -ErrorAction SilentlyContinue }
          if ($switches -notcontains "-Formats") { $switches += @("-Formats", "2d") }
          powershell -NoProfile -ExecutionPolicy Bypass -File package/3dmm-render/render-folder.ps1 `
            -InputDir $req -OutputDir ci-out/full @switches *>&1 | Tee-Object -FilePath ci-out/full.log
          Remove-Item -Recurse -Force package/3dmm-render/tools -ErrorAction SilentlyContinue

      - name: Publish results to ci-results branch
        if: always()
        shell: pwsh
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          OUTCOME: ${{ steps.compile.outcome }}
        run: |
          $short = $env:SHA.Substring(0, 7)
          "commit=$env:SHA`nbranch=$env:REF`ncompile=$env:OUTCOME`nrun=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" |
            Set-Content ci-out/summary.txt
          git config user.name "ci-results bot"
          git config user.email "ci-results@users.noreply.github.com"
          git fetch origin ci-results --depth 1 2>$null
          if ($LASTEXITCODE -eq 0) {
            git worktree add ../results origin/ci-results
          } else {
            git worktree add --detach ../results
            Push-Location ../results
            git checkout --orphan tmp-results
            git rm -rfq .
            Pop-Location
          }
          $dest = "../results/runs/$short"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item -Recurse ci-out/* $dest
          Set-Content ../results/LATEST $short
          Push-Location ../results
          git add -A
          git commit -qm "Results for $short ($env:REF, compile $env:OUTCOME)"
          for ($i = 0; $i -lt 5; $i++) {
            git push origin HEAD:ci-results
            if ($LASTEXITCODE -eq 0) { break }
            git fetch origin ci-results --depth 1
            git rebase origin/ci-results
          }
          Pop-Location

      - name: Upload renderer package
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: 3dmm-render
          path: package/

      - name: Upload build
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Movie-Maker
          path: build/
