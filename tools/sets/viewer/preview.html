<!doctype html><html><!-- render harness for shoot.js: one 544x306 view at a time, same lights and materials as index.html --><body style="margin:0;background:#000">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { addSurfaceTexture, makeSkyMaterial, makeSky } from './surface.js';
const W=544,H=306;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=+(new URLSearchParams(location.search).get("e")||1.05);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xbfe3ff); scene.add(makeSky(THREE));
const cam=new THREE.PerspectiveCamera(50,W/H,0.1,500);
scene.add(new THREE.HemisphereLight(0xfff6e8, 0xc9b8a8, 1.9));
const sun=new THREE.DirectionalLight(0xfff0d6, 1.3); sun.position.set(-14,40,18); sun.target.position.set(0,0,5);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera; sc.left=-30; sc.right=30; sc.top=30; sc.bottom=-30; sc.near=1; sc.far=90; sun.shadow.bias=-0.0005; sun.shadow.radius=4;
scene.add(sun); scene.add(sun.target);
const fill=new THREE.PointLight(0xfff2dd, 120, 60, 1.6); fill.position.set(0,22,5); scene.add(fill);
const cams=await (await fetch('cams.json')).json();
const g=await new GLTFLoader().loadAsync('model.glb');
g.scene.traverse(o=>{ if(!o.isMesh) return;
  const glow=o.name.includes('glow')||(o.parent&&o.parent.name.includes('glow'));
  const sky=o.name.includes('sky')||(o.parent&&o.parent.name.includes('sky'));
  o.material = sky ? makeSkyMaterial(THREE) : glow ? new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide})
                    : addSurfaceTexture(new THREE.MeshStandardMaterial({vertexColors:true, flatShading:false, roughness:0.85, metalness:0, side:THREE.DoubleSide}));
  o.castShadow=!glow && !o.name.startsWith('cabin'); o.receiveShadow=true; });
scene.add(g.scene);
window.setView=(k)=>{ const v=cams[k]; const r=v.rot;
  const m=new THREE.Matrix4().makeBasis(new THREE.Vector3(...r[0]),new THREE.Vector3(...r[1]),new THREE.Vector3(...r[2]));
  m.setPosition(new THREE.Vector3(...v.pos)); cam.matrixAutoUpdate=false; cam.matrix.copy(m); cam.updateMatrixWorld(true);
  cam.fov=v.fov; cam.updateProjectionMatrix(); renderer.render(scene,cam); };
window.setFree=(px,py,pz,tx,ty,tz,fov)=>{ cam.matrixAutoUpdate=true; cam.position.set(px,py,pz); cam.fov=fov; cam.updateProjectionMatrix(); cam.lookAt(tx,ty,tz); cam.updateMatrixWorld(true); renderer.render(scene,cam); };
window.ready=true;
</script></body></html>
