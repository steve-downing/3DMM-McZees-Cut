<title>Airplane Set in 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: the set fills the screen; a camera strip of the nine original 3DMM angles runs along the bottom, controls float above it. Single dark look, by choice: it's a viewport. */
:root {
  --ink: #12111a;          /* behind everything */
  --panel: rgba(24, 22, 36, 0.86);
  --line: rgba(236, 232, 245, 0.14);
  --fg: #ece8f5;
  --muted: #a39fb6;
  --gold: #d9b45a;         /* the seat trim */
  --teal: #4f9e88;         /* the carpet */
  --display: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
#orig { position: fixed; top: 0; bottom: 0; left: 50%; height: 100%; aspect-ratio: 544 / 306; transform: translateX(-50%);
  max-width: none; pointer-events: none; image-rendering: auto; }

.hud { position: fixed; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#title { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  padding: 10px 14px; max-width: min(420px, calc(100% - 32px)); }
#title h1 { margin: 0; font: 700 1.25rem/1.1 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
#title p { margin: 4px 0 0; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
#title .tag { font: 500 0.7rem/1 var(--display); text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold); }

#help { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  padding: 10px 14px; font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
#help kbd { font: 700 0.72rem/1 var(--body); color: var(--fg); border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px; }

#strip { left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: min(980px, calc(100% - 32px)); padding: 8px 10px 10px; display: grid; gap: 8px; }
#strip .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#strip .label { font: 500 0.72rem/1 var(--display); text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
#status { font: 700 0.85rem/1 var(--display); letter-spacing: 0.04em; color: var(--fg); }
#cams { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
#cams button { flex: 0 0 auto; position: relative; padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden;
  background: #000; cursor: pointer; width: 92px; aspect-ratio: 544 / 306; }
#cams button img { display: block; width: 100%; height: 100%; object-fit: cover; }
#cams button span { position: absolute; left: 4px; bottom: 3px; font: 700 0.7rem/1 var(--display); color: #fff;
  text-shadow: 0 1px 2px #000, 0 0 4px #000; }
#cams button[aria-pressed="true"] { border-color: var(--gold); }
#cams button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mix { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 0.8rem; color: var(--muted); }
.mix input { accent-color: var(--gold); width: 130px; }
.mix input:disabled { opacity: 0.35; }
/* the swipe: the 1995 picture left of the divider, the rebuilt set right of it */
#wipe { position: fixed; top: 0; bottom: 0; width: 36px; margin-left: -18px; z-index: 1; cursor: ew-resize; touch-action: none; }
#wipe::before { content: ""; position: absolute; top: 0; bottom: 0; left: 17px; width: 2px; background: var(--gold); box-shadow: 0 0 6px rgba(0,0,0,.6); }
#wipe .grip { position: absolute; top: 50%; left: 0; width: 36px; height: 36px; margin-top: -18px; border-radius: 50%;
  background: var(--gold); color: #1b1726; display: grid; place-items: center; font: 700 0.8rem/1 var(--body); box-shadow: 0 2px 10px rgba(0,0,0,.5); }
#wipe .tag { position: absolute; top: 50%; margin-top: 26px; font: 700 0.66rem/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--fg); background: rgba(18,17,26,.75); padding: 4px 6px; border-radius: 4px; white-space: nowrap; }
#wipe .tag.l { right: 22px; } #wipe .tag.r { left: 22px; }
#wipe:focus-visible .grip { outline: 2px solid var(--fg); outline-offset: 2px; }

#pad { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(196px + env(safe-area-inset-bottom, 0px)); padding: 8px; display: none;
  grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 6px; }
.btn { background: rgba(236, 232, 245, 0.08); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
  font: 700 1rem/1 var(--body); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
.btn:active, .btn.on { background: var(--teal); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 500 1rem var(--display);
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); z-index: 1; pointer-events: none; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 700 0.75rem/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  background: transparent; border: 0; padding: 6px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #1b1726; }
.seg button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
#actor-row select { font: 400 0.82rem/1.2 var(--body); color: var(--fg); background: rgba(236, 232, 245, 0.08);
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; max-width: 46vw; }
#actor-row select option { background: #241f33; color: var(--fg); }
#actor-row select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn.play { width: 34px; height: 30px; font-size: 0.85rem; padding: 0; }
.pick { display: inline-flex; align-items: center; gap: 8px; }
#frame-pick { flex: 1 1 320px; }
#costumes { flex-wrap: wrap; }
#costumes select { max-width: 9.5em; }
#frame { accent-color: var(--gold); flex: 1 1 120px; min-width: 90px; max-width: 360px; }
#frame-n { font: 500 0.8rem/1 var(--display); letter-spacing: 0.04em; color: var(--muted); min-width: 5.5em; font-variant-numeric: tabular-nums; }
@media (hover: none), (max-width: 700px) {
  #help { display: none; }
  #pad { display: grid; }
  #cams button { width: 76px; }
  .mix input { width: 100px; }
}
@media (max-width: 520px) {
  #title p { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="stage"></div>
<img id="orig" alt="" hidden>
<div id="wipe" hidden role="slider" tabindex="0" aria-label="Swipe between the 1995 picture and the rebuilt set" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="grip" aria-hidden="true">◀▶</div><span class="tag l">1995</span><span class="tag r">Rebuilt</span></div>
<div id="loading">Loading the set…</div>

<div id="title" class="hud">
  <div class="tag" id="set-tag">3D Movie Maker</div>
  <h1 id="set-title">A set, in 3D</h1>
  <p id="set-blurb"></p>
</div>

<div id="help" class="hud">
  <div>Drag to look around</div>
  <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows to move</div>
  <div><kbd>Q</kbd> <kbd>E</kbd> down / up · <kbd>Shift</kbd> faster</div>
  <div><kbd>1</kbd>–<kbd>9</kbd> original cameras · <kbd>X</kbd> swipe</div>
</div>

<div id="pad" class="hud" aria-label="Move">
  <button class="btn" data-k="KeyQ" aria-label="Down">▾</button>
  <button class="btn" data-k="KeyW" aria-label="Forward">▲</button>
  <button class="btn" data-k="KeyE" aria-label="Up">▴</button>
  <button class="btn" data-k="KeyA" aria-label="Left">◀</button>
  <button class="btn" data-k="KeyS" aria-label="Back">▼</button>
  <button class="btn" data-k="KeyD" aria-label="Right">▶</button>
</div>

<div id="strip" class="hud">
  <div class="row">
    <span class="label">3DMM cameras</span>
    <span id="status">Camera 1</span>
    <div class="seg" role="group" aria-label="Style" id="styles">
      <button type="button" id="style-toon" aria-pressed="true">Cartoon</button>
      <button type="button" id="style-photo" aria-pressed="false">Photo</button>
    </div>
    <label class="mix" for="mix">Swipe to the 1995 picture
      <input id="mix" type="range" min="0" max="100" value="0">
    </label>
  </div>
  <div class="row" id="actor-row">
    <span class="pick"><label class="label" for="actor">Actor</label>
      <select id="actor"><option value="">None</option></select></span>
    <span class="pick" id="action-pick" hidden><label class="label" for="action">Action</label>
      <select id="action"></select></span>
    <span class="pick" id="frame-pick" hidden>
      <button type="button" class="btn play" id="play" aria-label="Play">▶</button>
      <input id="frame" type="range" min="0" max="0" value="0" aria-label="Frame">
      <span id="frame-n"></span>
      <span class="seg"><button type="button" id="smooth" aria-pressed="true" title="Blend between 3DMM's frames and play at 24 fps instead of 6">Smooth</button></span></span>
  </div>
  <div class="row" id="costume-row" hidden>
    <span class="label">Costume</span>
    <span id="costumes" class="pick"></span>
  </div>
  <div id="cams"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { addSurfaceTexture, makeSkyMaterial, makeSky, makeNightSky, makeNightSkyMaterial } from './surface.js';

// The set: its original camera views (views/cams.json: vertical fov, position, rotation rows,
// BRender camera matrix) and its settings (set.json, the set's viewer.json: names, lights,
// sky, where an actor stands, camera fixes; see build_site.py)
const [CAMS, CFG] = await Promise.all([
  fetch('views/cams.json').then(r => r.json()),
  fetch('set.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))]);
const EX = CFG.explorer || {};
document.getElementById('set-tag').textContent = EX.tag || '3D Movie Maker';
document.getElementById('set-title').textContent = EX.title || 'A set, in 3D';
document.getElementById('set-blurb').textContent = EX.blurb || '';
document.getElementById('styles').hidden = !EX.photo;
document.getElementById('loading').textContent = 'Loading ' + (EX.name || 'the set') + '…';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));   // Retina at full density is a lot of pixels for little gain
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // nothing moves: shadows are computed once per model
// draw only when something changed (camera moved, model loaded, window resized)
let dirty = true; const invalidate = () => { dirty = true; };
for (const ev of ['resize', 'keydown', 'keyup', 'pointerdown', 'pointerup', 'wheel']) addEventListener(ev, invalidate, { passive: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.4;   // matches the brightness of the original renders
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12111a);
if (CFG.sky) scene.add(CFG.sky === 'night' ? makeNightSky(THREE) : makeSky(THREE));   // seen through the window openings
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 400);
camera.rotation.order = 'YXZ';

// the set's lights, for the cartoon version (the photo version is unlit: its lighting is baked into the renders)
{
  const L = CFG.lights || { hemi: ['#fff6e8', '#c9b8a8', 1.9] };
  scene.add(new THREE.HemisphereLight(L.hemi[0], L.hemi[1], L.hemi[2]));
  if (L.sun) {
    const sun = new THREE.DirectionalLight(L.sun.color, L.sun.intensity), ext = L.sun.extent || 30;
    sun.position.set(...L.sun.pos); sun.target.position.set(...L.sun.target);
    sun.castShadow = CFG.shadows !== false; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.radius = 4;
    Object.assign(sun.shadow.camera, { left: -ext, right: ext, top: ext, bottom: -ext, near: 1, far: 160 });
    scene.add(sun, sun.target);
  }
  for (const l of L.lamps || []) { const p = new THREE.PointLight(l.color, l.intensity, l.distance, 1.6); p.position.set(...l.pos); scene.add(p); }
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// --- camera pose helpers -------------------------------------------------
function camPose(i) {
  const c = CAMS[i], r = c.rot;
  const m = new THREE.Matrix4().makeBasis(new THREE.Vector3(...r[0]), new THREE.Vector3(...r[1]), new THREE.Vector3(...r[2]));
  const e = new THREE.Euler().setFromRotationMatrix(m, 'YXZ');
  return { pos: new THREE.Vector3(...c.pos), yaw: e.y, pitch: e.x, roll: e.z, fov: c.fov };
}
let yaw = 0, pitch = 0, roll = 0;
let anim = null, current = -1;
const mix = document.getElementById('mix'), orig = document.getElementById('orig'), status = document.getElementById('status');
function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * t; }
function goCam(i, instant) {
  const to = camPose(i);
  const from = { pos: camera.position.clone(), yaw, pitch, roll, fov: camera.fov };
  anim = { from, to, t0: performance.now(), dur: instant || matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 900, i };
  setCurrent(-1);
}
// cameras that sit just outside a simplified wall get it clipped away (the cabin's camera 7)
const NEAR = CFG.near || {};
function setCurrent(i) {
  current = i;
  const near = NEAR[i] || 0.05;
  if (camera.near !== near) { camera.near = near; camera.updateProjectionMatrix(); }
  document.querySelectorAll('#cams button').forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
  mix.disabled = i < 0;
  if (i >= 0) { orig.src = 'views/cam' + i + '.jpg'; status.textContent = 'Camera ' + (i + 1); }
  else status.textContent = anim ? 'Moving…' : 'Free look';
  orig.hidden = wipeEl.hidden = i < 0;
  placeWipe();
}
// The swipe: the 1995 picture shows left of the divider, the rebuilt set right of it.
// Both are drawn from the same camera, so anything that differs jumps out at the line.
const wipeEl = document.getElementById('wipe');
function placeWipe() {
  const x = innerWidth * mix.value / 100;
  wipeEl.style.left = x + 'px'; wipeEl.setAttribute('aria-valuenow', mix.value);
  const r = orig.getBoundingClientRect();   // the picture is centered and may be wider than the window
  orig.style.clipPath = 'inset(0 ' + Math.max(0, r.width - (x - r.left)) + 'px 0 0)';
}
mix.addEventListener('input', placeWipe);
addEventListener('resize', placeWipe);
orig.addEventListener('load', placeWipe);
function setWipe(v) { mix.value = Math.max(0, Math.min(100, v)); placeWipe(); }
wipeEl.addEventListener('pointerdown', e => { e.preventDefault(); wipeEl.setPointerCapture(e.pointerId); wipeEl._drag = true; });
wipeEl.addEventListener('pointermove', e => { if (wipeEl._drag) setWipe(e.clientX / innerWidth * 100); });
wipeEl.addEventListener('pointerup', () => { wipeEl._drag = false; });
wipeEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); setWipe(+mix.value + (e.key === 'ArrowRight' ? 5 : -5)); }
});

// --- camera strip ----------------------------------------------------------
const camsEl = document.getElementById('cams');
CAMS.forEach((c, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', 'Original camera ' + (i + 1));
  b.innerHTML = '<img alt="" src="views/cam' + i + '.jpg"><span>' + (i + 1) + '</span>';
  b.addEventListener('click', () => goCam(i));
  camsEl.appendChild(b);
});

// --- look and move -------------------------------------------------------
const keys = new Set();
addEventListener('keydown', e => {
  if (/^(INPUT|SELECT)$/.test(e.target.tagName)) return;
  if (/^Digit[1-9]$/.test(e.code)) { goCam(+e.code.slice(5) - 1); return; }
  if (e.code === 'KeyX') { if (current >= 0) setWipe(+mix.value > 0 ? 0 : 50); return; }
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
document.querySelectorAll('#pad .btn').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys.add(k); b.classList.add('on'); b.setPointerCapture(e.pointerId); });
  const up = () => { keys.delete(k); b.classList.remove('on'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
});
let drag = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = 0.0042 * (camera.fov / 60);
  yaw += (e.clientX - drag.x) * k; pitch += (e.clientY - drag.y) * k;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
  drag = { x: e.clientX, y: e.clientY }; invalidate();
  if (anim) anim = null;
  roll *= 0.9; if (current >= 0) setCurrent(-1);
});
cv.addEventListener('pointerup', () => { drag = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); const f = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
  camera.position.addScaledVector(f, -e.deltaY * 0.01); if (current >= 0) setCurrent(-1); }, { passive: false });

// --- the models ----------------------------------------------------------
// both ship as base64 text (artifacts don't serve .glb files); photo loads on first use
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const models = {}; let style = 'toon';
const loadingEl = document.getElementById('loading');
function loadModel(name) {
  if (models[name]) return models[name];
  models[name] = fetch(name + '.glb.txt').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(b64 => {
    const bin = atob(b64.trim()); const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return loader.parseAsync(buf.buffer, '');
  }).then(g => {
    g.scene.traverse(o => {
      if (!o.isMesh) return;
      if (name === 'toon') {
        if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();   // textured pieces (paintings) come without
        const nm = o.name + (o.parent ? o.parent.name : '');
        const glow = /glow/.test(nm), sky = /sky/.test(nm);
        o.material = sky ? (CFG.sky === 'night' ? makeNightSkyMaterial(THREE) : makeSkyMaterial(THREE))
          : /picture|textured/.test(nm) && o.material.map ? new THREE.MeshStandardMaterial({ map: o.material.map, emissiveMap: o.material.map, emissive: 0xffffff, emissiveIntensity: /picture/.test(nm) ? 0.18 : 0, roughness: 0.9, metalness: 0, side: THREE.DoubleSide })
          : /velvet/.test(nm) ? addSurfaceTexture(new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.9, metalness: 0, sheen: 1, sheenRoughness: 0.5, sheenColor: 0xa83a3a, side: THREE.DoubleSide }))
          : glow ? new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, toneMapped: false })
          : /glass/.test(nm) ? new THREE.MeshStandardMaterial({ vertexColors: true, transparent: true, opacity: 0.3, roughness: 0.08, metalness: 0, depthWrite: false, side: THREE.DoubleSide })
          : addSurfaceTexture(new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: false, roughness: 0.85, metalness: 0, side: THREE.DoubleSide }));
        o.castShadow = !glow && !/glass/.test(nm) && !/^(cabin|room|outside|rug)/.test(nm);
        o.receiveShadow = true;
      } else {
        const map = o.material.map;
        if (map) { map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
        o.material = new THREE.MeshBasicMaterial({ map: map || null, vertexColors: !map, side: THREE.DoubleSide, toneMapped: false });
      }
    });
    g.scene.visible = false; scene.add(g.scene);
    return g.scene;
  });
  return models[name];
}
function setStyle(name) {
  style = name;
  document.getElementById('style-toon').setAttribute('aria-pressed', String(name === 'toon'));
  document.getElementById('style-photo').setAttribute('aria-pressed', String(name === 'cabin'));
  loadingEl.textContent = 'Loading ' + (EX.name || 'the set') + '…'; loadingEl.hidden = false;
  loadModel(name).then(root => {
    if (style !== name) return;
    for (const k in models) models[k].then(r => { r.visible = (k === name); renderer.shadowMap.needsUpdate = true; invalidate(); });
    loadingEl.hidden = true;
  }).catch(err => { loadingEl.textContent = "Couldn't load the model: " + err.message; });
}
document.getElementById('style-toon').addEventListener('click', () => setStyle('toon'));
document.getElementById('style-photo').addEventListener('click', () => setStyle('cabin'));
setStyle('toon');

// --- actors ---------------------------------------------------------------
// One of 3DMM's actors at a time, standing in the aisle facing the rear. Each actor
// ships as actors/<id>.glb.txt (every model its actions and costumes use, in model space,
// plus one placeholder per costume material) and actors/<id>.json (body-part tree,
// costumes, and for every action the cels: which model each part shows and its
// transform relative to its parent). See rig() in tools/sets/lib/actor.py.
const actorSel = document.getElementById('actor'), actionSel = document.getElementById('action');
const frameIn = document.getElementById('frame'), frameN = document.getElementById('frame-n'), playBtn = document.getElementById('play');

function f16(h) {

function partMesh(p, m) { return m === -2 ? actor.acc[p] : m; }

}
function setFrame(c) {

  const n = actor.meta.actions[actor.action].cels.length;
  c = ((c % n) + n) % n; actor.cel = c; actor.t = 0;
  pose(c, 0);
  frameIn.value = c; frameN.textContent = 'Frame ' + (c + 1) + ' / ' + n;
}
function setPlaying(on) {
  playing = on && actor && actor.meta.actions[actor.action].cels.length > 1 ? { t0: performance.now(), pos0: actor.cel + actor.t } : null;
  playBtn.textContent = playing ? '❚❚' : '▶';
  playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  invalidate();
}
// called from the render loop: 3DMM plays 6 cels a second; smooth adds 3 blended poses between cels (24 fps)
function tickActor(now) {
  if (!playing || !actor) return;
  const n = actor.meta.actions[actor.action].cels.length;
  // a frame's timestamp is taken before that frame's input events run, so it can be a little
  // earlier than the click that started playing: never let the clock run backwards
  const pos = playing.pos0 + Math.max(0, now - playing.t0) / 1000 * 6, sub = smooth ? 4 : 1;
  const q = Math.floor(pos * sub) / sub, c = ((Math.floor(q) % n) + n) % n, t = q - Math.floor(q);

smoothBtn.addEventListener('click', () => {
  smooth = !smooth; smoothBtn.setAttribute('aria-pressed', String(smooth));
  if (playing) setPlaying(true);
});
function setAction(k) {
  if (!actor) return;
  actor.action = k; actionSel.value = k;
  const n = actor.meta.actions[k].cels.length;
  framePick.hidden = n < 2; frameIn.max = n - 1;
  setFrame(0);
  setPlaying(!!playing);   // restart the clock from the first cel (or stop, for one-cel actions)
}
function setCostume(s, o) {
  const set = actor.meta.sets[s], opt = set.options[o];
  set.parts.forEach((p, k) => {
    const mat = opt.mats[k] >= 0 ? actor.mats[opt.mats[k]] : null;
    actor.partMat[p] = mat;
    actor.acc[p] = opt.acc[k];
    for (const m of actor.partMeshes[p]) if (mat) actor.meshes[m].traverse(c => { if (c.isMesh) c.material = mat; });
  });

function buildCostumeUI() {
  costumesEl.innerHTML = '';

    if (set.options.length < 2) return;
    const sel = document.createElement('select'); sel.setAttribute('aria-label', set.label);
    set.options.forEach((_, o) => { const op = document.createElement('option'); op.value = o; op.textContent = set.label + ' ' + (o + 1) + '/' + set.options.length; sel.append(op); });
    sel.addEventListener('change', () => setCostume(s, +sel.value));

}
function clearActor() {
  setPlaying(false);
  if (actor) { scene.remove(actor.root); actor.root.traverse(o => { if (o.isMesh) o.geometry.dispose(); }); actor = null; }

  renderer.shadowMap.needsUpdate = true; invalidate();
}
async function loadActor(id) {
  const req = ++actorReq;

  loadingEl.textContent = 'Loading ' + actorSel.selectedOptions[0].textContent + '…'; loadingEl.hidden = false;
  try {
    const [meta, b64] = await Promise.all([
      fetch('actors/' + id + '.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
      fetch('actors/' + id + '.glb.txt').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })]);
    const bin = atob(b64.trim()), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const g = await loader.parseAsync(buf.buffer, '');

    const mats = meta.mats.map((mm, k) => {
      const o = g.scene.getObjectByName('mat' + k); let mat = null;
      o.traverse(c => { if (c.isMesh && !mat) mat = c.material; });
      mat = mat.clone(); mat.side = THREE.DoubleSide;
      if (mat.map) {
        mat.map = mat.map.clone(); mat.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
        if (mm.uvxf) { const u = mm.uvxf; mat.map.matrixAutoUpdate = false; mat.map.matrix.set(u[0], u[2], u[4], u[1], u[3], u[5], 0, 0, 1); }
      }

    const nodes = meta.parents.map(() => { const n = new THREE.Group(); n.matrixAutoUpdate = false; return n; });
    nodes.forEach((n, p) => (meta.parents[p] >= 0 ? nodes[meta.parents[p]] : root).add(n));

    const meshPart = new Array(meta.meshes).fill(-1);
    for (const a of meta.actions) for (const cel of a.cels) cel.forEach(([m], p) => { if (m >= 0) meshPart[m] = p; });
    for (const set of meta.sets) for (const opt of set.options) set.parts.forEach((p, k) => { if (opt.acc[k] >= 0) meshPart[opt.acc[k]] = p; });
    const partMeshes = meta.parents.map(() => []);

    for (let k = 0; k < meta.meshes; k++) {

    actionPick.hidden = false;

}
fetch('actors/index.json').then(r => r.ok ? r.json() : []).then(list => {
  for (const a of list) { const o = document.createElement('option'); o.value = a.id; o.textContent = a.name; actorSel.append(o); }
  if (!list.length) document.getElementById('actor-row').hidden = true;
}).catch(() => { document.getElementById('actor-row').hidden = true; });
actorSel.addEventListener('change', () => loadActor(actorSel.value));
actionSel.addEventListener('change', () => setAction(+actionSel.value));
frameIn.addEventListener('input', () => { setPlaying(false); setFrame(+frameIn.value); });

// for the review scripts: stand at p, look at t
window.__look = (p, t, fov) => {

// start where 3DMM's first camera stood
{ const p = camPose(0); camera.position.copy(p.pos); yaw = p.yaw; pitch = p.pitch; roll = p.roll; camera.fov = p.fov; camera.updateProjectionMatrix(); setCurrent(0); }
